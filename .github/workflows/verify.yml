name: Verify WelcomeScore

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24.x
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run cli:check
      - run: npm run cli:test
      - run: npm run cli:build
      - run: npm run cli:pack:check
      - run: npx tsc --noEmit
      - run: npm run build
